<title>Mechanic 维修工作板</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
/* Pollisum style guide: Roboto, red titles in Black caps, maroon top and bottom bars, mist panels, blush cards, navy badges. Role, type and the three header buttons keep their own colours as requested. */
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#191D24; --mute:#5b626d; --line:#E4E4E4; --head:#F3F3F3; --mist:#F3F3F3; --blush:#EDD4D4;
  --maroon:#7A0C1C; --footer:#6A0303; --red:#990000; --title:#990000; --signal:#C41E2D; --alert:#DC0E20; --navy:#1E2F4E; --good:#007A38;
  --brand:#7A0C1C; --focus:#1E2F4E;
  --demo:#E8710A; --switch:#5B7083; --out:#C41E2D;
  --r-admin:#7B3FC4; --r-supervisor:#0E7C86; --r-mechanic:#1E8A4C; --r-operation:#1F6FD1; --r-management:#B45309; --r-department_head:#BE185D;
  --tl:92%; --tt:26%;
  --mono:'Roboto',system-ui,sans-serif;
  --sans:'Roboto','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171c; --panel:#1d2127; --ink:#ECEEF1; --mute:#9aa2ad; --line:#323840; --head:#252a31; --mist:#252a31; --blush:#4a2428;
  --title:#F07C86; --red:#B3202F; --focus:#9fb4d8; --tl:22%; --tt:82%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1d2127; --ink:#ECEEF1; --mute:#9aa2ad; --line:#323840; --head:#252a31; --mist:#252a31; --blush:#4a2428;
  --title:#F07C86; --red:#B3202F; --focus:#9fb4d8; --tl:22%; --tt:82%; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-block:14px 0}
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--maroon);color:#fff;padding:14px 18px;border-radius:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20}
.top .brand{font-size:11px;font-weight:700;letter-spacing:.2em;opacity:.85;display:block}
.top h1{font-size:22px;margin:0;font-weight:900;letter-spacing:.01em;text-transform:uppercase;line-height:1.1}
.top .ttl{margin-right:auto}
.top .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--red);background:var(--panel);color:var(--red);border-radius:6px;padding:6px 14px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;min-height:36px}
.btn:hover{filter:brightness(.95)}
.btn.pri{background:var(--red);color:#fff}
.btn.sm{padding:3px 10px;min-height:28px;font-size:12px}
.btn.demo{background:var(--demo);border-color:var(--demo);color:#fff}
.btn.sw{background:var(--switch);border-color:var(--switch);color:#fff}
.btn.out{background:var(--out);border-color:var(--out);color:#fff}
.btn.lang{background:transparent;border-color:rgba(255,255,255,.7);color:#fff}
.btn.danger{color:var(--out);border-color:var(--out);background:var(--panel)}
.btn.plain{border-color:var(--line);color:var(--ink)}
.me{display:flex;gap:8px;align-items:center;background:transparent;border:0;color:#fff;padding:2px 4px}
.me b{font-weight:700}
.role{display:inline-block;border-radius:999px;padding:1px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;white-space:nowrap}
.role.supervisor{background:var(--r-supervisor)}.role.admin{background:var(--r-admin)}.role.mechanic{background:var(--r-mechanic)}.role.operation{background:var(--r-operation)}.role.management{background:var(--r-management)}.role.department_head{background:var(--r-department_head)}
.tabs{display:flex;gap:6px;margin:16px 0 12px;flex-wrap:wrap}
.tab{border:1.5px solid var(--red);background:var(--panel);color:var(--red);padding:7px 18px;border-radius:6px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tab.on{background:var(--red);color:#fff}
.badge{background:var(--alert);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:6px}
.banner{background:var(--blush);border:1px solid var(--signal);padding:6px 12px;border-radius:6px;margin-top:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search],.bar select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;min-height:36px}
.bar input[type=search]{flex:1 1 220px;min-width:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{text-align:left;border:1px solid var(--line);background:var(--mist);border-radius:8px;padding:10px 14px}
.tile .l{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.tile .l::before{content:"";width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 65% 45%)}
.tile .n{display:block;font-size:30px;font-weight:900;color:var(--title);line-height:1.1;font-variant-numeric:tabular-nums}
.tile.on{background:var(--blush);border-color:var(--signal)}
.st{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--mist);color:var(--ink);border-radius:999px;padding:2px 12px 2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 65% 45%)}
.ty{display:inline-block;background:hsl(var(--h) 60% var(--tl));color:hsl(var(--h) 55% var(--tt));border-left:5px solid hsl(var(--h) 60% 45%);padding:1px 8px;font-weight:700;font-size:13px;white-space:nowrap;border-radius:2px}
.grp-h{display:flex;align-items:center;gap:10px;margin:20px 0 6px}
.grp-h .ty{font-size:15px;padding:3px 12px}
.grp-h span.n{color:var(--mute)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--mist);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
tr.row:hover td{background:var(--mist)}
tr.row{cursor:pointer}
td.long{white-space:normal;min-width:190px;max-width:260px}
td.mono,.mono{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
td.nil{color:var(--mute)}
td.act{white-space:nowrap}
td.act .btn{margin-right:4px}
.empty{padding:30px 16px;text-align:center;color:var(--mute);background:var(--mist);border-radius:8px}
.auth{max-width:420px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-bottom:8px solid var(--footer);border-radius:8px;padding:22px}
.auth h2{margin:0 0 4px;font-size:26px;font-weight:900;text-transform:uppercase;color:var(--title)}
.auth .sub{color:var(--mute);margin:0 0 14px}
.rec{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rec button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--mist);border-radius:6px;padding:8px 10px}
.ov{position:fixed;inset:0;background:rgba(25,29,36,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:50}
.md{background:var(--panel);border-radius:8px;width:100%;max-width:820px;padding:20px;border-bottom:8px solid var(--footer)}
.md h3{margin:0 0 12px;font-size:22px;font-weight:900;text-transform:uppercase;color:var(--title);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:10px 12px 12px;min-width:0}
legend{font-weight:700;padding:0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.w{grid-column:1/-1}
.f label{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.f label i{color:var(--alert);font-style:normal}
.f input,.f select,.f textarea,.f .ro{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;min-height:36px;width:100%;min-width:0}
.f .ro{display:flex;align-items:center;color:var(--ink);background:var(--mist)}
.f textarea{min-height:36px;height:40px;resize:vertical}
fieldset.recdone{background:#FFF4F7}fieldset.recdone .f input,fieldset.recdone .f select,fieldset.recdone .f textarea{background:#FFF4F7;opacity:1;color:inherit}
fieldset.recopen{background:#fff}fieldset.recopen .f input,fieldset.recopen .f select,fieldset.recopen .f textarea{background:#fff}
.f input[disabled],.f select[disabled],.f textarea[disabled]{opacity:.65}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.err{color:var(--alert);margin:6px 0 0;min-height:1em}
.meta{color:var(--mute);font-size:13px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:4px 16px}
.meta b{color:var(--ink)}
.vlist{position:absolute;left:0;right:0;top:100%;z-index:5;max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.vopt{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 9px}
button.vopt:hover{background:var(--blush)}
.vopt small{color:var(--mute)}
.seg{display:inline-flex;border:1.5px solid rgba(255,255,255,.75);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;padding:6px 12px;min-height:34px}
.seg button.on{background:#fff;color:var(--maroon)}
.phg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:8px}
.ph{position:relative;aspect-ratio:1;background:var(--mist);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.phx{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(25,29,36,.8);color:#fff;font-size:16px;line-height:1;padding:0}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.sgbox{position:relative;height:110px;border:1px dashed var(--line);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.sgbox img{max-width:100%;max-height:100%}
.stamp{position:absolute;right:6px;bottom:4px;height:92px;width:auto;opacity:.9;pointer-events:none}
.sgo{position:fixed;inset:0;background:rgba(25,29,36,.7);z-index:85;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.sgc{width:100%;height:auto;aspect-ratio:520/220;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair}
.foot{height:14px;background:var(--footer);margin:40px -16px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:90;max-width:90vw}
</style>

async function exportPDF(list){
  if(!list.length){toast(L('没有可导出的工作。','Nothing to export.'));return}
  toast(L('正在生成 PDF…','Preparing PDF…'));
  let f=null;
  try{
    const paths=[...new Set(list.flatMap(c=>[...(c.photos||[]),...Object.values(c.sigs||{}).map(x=>x.path)]))];
    const urls={};
    for(let i=0;i<paths.length;i+=100){const r=await sb.storage.from('case-photos').createSignedUrls(paths.slice(i,i+100),3600);(r.data||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}
    f=document.createElement('iframe');f.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0';document.body.append(f);
    const loaded=new Promise(r=>f.onload=r);
    f.srcdoc=reportHtml(list,urls);
    await loaded;
    const d=f.contentDocument;
    await Promise.all([...d.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
    try{await d.fonts.ready}catch(e){}
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
    let first=true;
    const LIM=1123-10-18;
    for(const sec of [...d.querySelectorAll('section.pg')]){
      const units=[];let cur=null;
      [...sec.children].forEach(el=>{if(el.tagName==='H2'||!cur){cur=d.createElement('div');units.push(cur)}cur.append(el)});
      let page=sec;
      units.forEach(u=>{page.append(u);const pr=page.getBoundingClientRect();if(u.getBoundingClientRect().bottom-pr.top>LIM&&page.children.length>1){const np=d.createElement('section');np.className='pg';page.after(np);np.append(u);page=np}});
    }
    for(const pg of d.querySelectorAll('section.pg')){
      const cv=await html2canvas(pg,{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:794});
      if(!first)pdf.addPage();first=false;
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,H);
    }
    const name=(list.length===1?list[0].caseNo:'Mechanic-jobs-'+fD(new Date().toISOString()))+'.pdf';
    pdfDialog(pdf.output('blob'),name,list.length);
  }catch(x){toast(L('生成 PDF 失败','PDF failed'))}
  if(f)f.remove();
}

async function saveCase(e){

  const now=new Date().toISOString();let d={};let notifyInfo=null;
  if(editR)Object.assign(d,{vehicleNo:v[0],org:v[1],serialNo:v[2],subType:v[3],make:v[4],model:v[5],chassis:v[6],lmNo:v[7],repairLocation:g('#c_rl'),customer:g('#c_cus'),location:g('#c_loc'),driverName:g('#c_dn'),driverPhone:g('#c_dp'),issue:g('#c_is')});
  try{
    if(isNew){
      const nr=await sb.rpc('next_case_no');if(nr.error||!nr.data)throw nr.error||new Error('case no');const no=nr.data;
      const gps=await gpsP;gpsP=null;if(!gps)throw new Error(L('必须获取 GPS 位置，请允许浏览器定位后重试','GPS location is required. Allow location access and try again.'));
      const nid=crypto.randomUUID(),paths=[];
      for(const q of PH.queue)paths.push(await uploadPhoto(nid,q.blob));
      const ins=await sb.from('cases').insert({...d,id:nid,photos:paths,caseNo:no,status:'open',log:[{at:now,by:me.id,byName:me.name,from:'',to:'open',...(gps?{gps}:{})}],createdAt:now,createdById:me.id,createdByName:me.name,claimedById:'',claimedByName:'',claimedAt:''});
      if(ins.error)throw ins.error;
    }else{
      if(canEditWork(c)){
        const Ly=recLayout(c);const recs=Ly.rs.map(r=>({...r}));let chg=false;
        const K=['status','tech','workDone','partsUsed','partsRequired','ot'];
        for(let i=0;i<Ly.n;i++){
          const wd=$('#r'+i+'_wd');if(!wd||wd.disabled)continue;
          const ot=g('#r'+i+'_ot');
          const nr={...(recs[i]||{}),status:g('#r'+i+'_st'),tech:g('#r'+i+'_te'),workDone:g('#r'+i+'_wd'),partsUsed:g('#r'+i+'_pu'),partsRequired:g('#r'+i+'_pr'),ot:ot===''||ot==null?'':String(Number(ot))};
          const old=recs[i];
          if(old){if(K.every(k=>String(old[k]??'')===String(nr[k]??'')))continue}
          else if(!(nr.workDone||nr.partsUsed||nr.partsRequired||nr.ot||nr.status!==c.status))continue;
          Object.assign(nr,{at:now,by:me.id,byName:me.name});recs[i]=nr;chg=true}
        if(chg){d.records=recs;d.ot=otSum({records:recs})}

      Object.assign(d,{updatedAt:now,updatedById:me.id,updatedByName:me.name});
      let gps=null;const changed=d.status&&d.status!==c.status;
      if(changed){gps=await (gpsP||getGps());gpsP=null;if(!gps)throw new Error(L('必须获取 GPS 位置，请允许浏览器定位后重试','GPS location is required. Allow location access and try again.'));d.log=[...(c.log||[]),{at:now,by:me.id,byName:me.name,from:c.status,to:d.status,...(gps?{gps}:{})}]}
      const sg=(c.sigs||{}).customer,nm=$('#sg_cname');
      if(sg&&nm&&SG.cust&&(nm.value.trim()||L('客户','Customer'))!==sg.name)d.sigs={...c.sigs,customer:{...sg,name:nm.value.trim()||L('客户','Customer')}};
      const up=await sb.from('cases').update(d).eq('id',c.id).select();
      if(up.error||!up.data.length)throw up.error||new Error('denied');
      if(changed)notifyInfo={...c,...d,status:d.status,gps};
    }
    PH.queue.forEach(q=>URL.revokeObjectURL(q.url));closeModal();toast(L('已保存','Saved'));refreshData();
    if(!isNew&&notifyInfo)notifyAfter(notifyInfo);
  }catch(x){err.textContent=L('保存失败：','Save failed: ')+(x.message||x.code||'')}
}

async function clock(f,i){

  if(r[f]&&!isMgr()){toast(L('此记录已打卡，只有管理员可以修改','Already recorded. Only an admin can change it.'));return}

  if(r.workDone!==undefined||true){const m={te:'tech',wd:'workDone',pu:'partsUsed',pr:'partsRequired'};for(const k in m){const x=fv(k);if(x!==null)r[m[k]]=x}const o=fv('ot');if(o!==null)r.ot=o===''?'':String(Number(o))}
  r[f]=now;recs[i]=r;
  try{const up=await sb.from('cases').update({records:recs,updatedAt:now,updatedById:me.id,updatedByName:me.name}).eq('id',c.id).select();
    if(up.error||!up.data.length)throw up.error||new Error('denied');
